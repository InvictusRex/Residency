services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smt
      POSTGRES_PASSWORD: smt
      POSTGRES_DB: society_maintenance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smt -d society_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smt:smt@db:5432/society_maintenance
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
