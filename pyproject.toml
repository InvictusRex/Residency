[project]
name = "society-maintenance-tracker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
